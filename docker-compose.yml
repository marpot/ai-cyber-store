services:
  wordpress:
    image: wordpress:latest
    container_name: cyber_store_wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes:/var/www/html/wp-content/themes
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./wordpress/.htaccess:/var/www/html/.htaccess
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: cyber_store_mysql
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./wordpress_backup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: cyber_store_postgres
    restart: always
    environment:
      POSTGRES_DB: cyber_ai
      POSTGRES_USER: ai_admin
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_admin -d cyber_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: cyber_store_recommendation
    restart: always
    working_dir: /app
    volumes:
      - ./recommendation-service:/app
    env_file:
      - path: ./recommendation-service/.env
        required: false
    environment:
      PYTHONPATH: /app
      WORDPRESS_API_URL: ${WORDPRESS_API_URL:-http://wordpress:80}
      RECOMMENDATION_CONFIDENCE_THRESHOLD: ${RECOMMENDATION_CONFIDENCE_THRESHOLD:-0.45}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: cyber_store_frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      recommendation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  postgres_data:
  frontend_node_modules:
  wordpress_data: