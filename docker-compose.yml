services:

  wordpress:
    image: wordpress:latest
    container_name: cyber_store_wordpress
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes:/var/www/html/wp-content/themes
      - ./wordpress/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./wordpress/.htaccess:/var/www/html/.htaccess
    depends_on:
      - mysql


  mysql:
    image: mysql:8.0
    container_name: cyber_store_mysql
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql


  postgres:
    image: postgres:16
    container_name: cyber_store_postgres
    restart: always
    environment:
      POSTGRES_DB: cyber_ai
      POSTGRES_USER: ai_admin
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  recommendation-service:
    build:
      context: ./recommendation-service
    container_name: cyber_store_recommendation
    restart: always
    working_dir: /app
    volumes:
      - ./recommendation-service/app:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres


  frontend:
    build:
      context: ./frontend
    container_name: cyber_store_frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - recommendation-service


volumes:
  mysql_data:
  postgres_data:
  frontend_node_modules:
  wordpress_data: